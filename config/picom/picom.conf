# voidwolf picom — light defaults (safe-ish on NVIDIA + XLibre)
# Installed to ~/.config/picom/picom.conf by install-dotfiles.sh
# Override anytime; restart with: pkill picom; picom -b

#################################
# Backend / sync
#################################
backend = "glx";
vsync = true;
# Prefer stable over fancy on proprietary NVIDIA
use-damage = true;
# Note: glx-no-stencil / glx-no-rebind-pixmap removed — obsolete in picom v13+

#################################
# Shadows (off — light profile)
#################################
shadow = false;
# shadow = true;
# shadow-radius = 8;
# shadow-opacity = 0.35;
# shadow-offset-x = -8;
# shadow-offset-y = -8;
# shadow-exclude = [
#   "name = 'Notification'",
#   "class_g = 'Dunst'",
#   "class_g = 'dwm'",
# ];

#################################
# Fading
#################################
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 8;

#################################
# Opacity (subtle inactive)
#################################
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Keep menus / popups readable
opacity-rule = [
  "100:class_g = 'dmenu'",
  "100:class_g = 'Dunst'",
  "100:class_g = 'Rofi'",
  "100:class_g = 'slock'",
  "100:class_g = 'XSecurelock'",
];

#################################
# Corners (off for light/NVIDIA)
#################################
# corner-radius = 0;
# rounded-corners-exclude = [ "class_g = 'dwm'" ];

#################################
# Window types
#################################
wintypes: {
  tooltip = { fade = true; shadow = false; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 1.0; }
  dropdown_menu = { opacity = 1.0; }
};

#################################
# Misc
#################################
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
# Unredirect fullscreen games/video when possible
unredir-if-possible = true;
