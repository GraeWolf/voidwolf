# voidwolf — hybrid RandR 1.4 style (profile: nvidia-hybrid-randr)
# Use when PRIME per-app offload is unsupported (e.g. nvidia580 handbook gap)
# or battery life requires session-wide GPU choice.
#
# Provider offload still uses xrandr; see docs/nvidia.md.
# This file keeps both drivers loadable without forcing NVIDIA as PrimaryGPU.

Section "OutputClass"
	Identifier "igpu-modesetting"
	MatchDriver "i915|amdgpu"
	Driver "modesetting"
EndSection

Section "OutputClass"
	Identifier "nvidia"
	MatchDriver "nvidia-drm"
	Driver "nvidia"
	Option "AllowEmptyInitialConfiguration"
	ModulePath "/usr/lib/nvidia/xorg"
	ModulePath "/usr/lib64/nvidia/xorg"
	ModulePath "/usr/lib/xorg/modules"
EndSection
