# voidwolf — discrete NVIDIA (profile: nvidia)
# Install: sudo cp to /etc/X11/xorg.conf.d/  (or nvidia-setup.sh)
# Requires proprietary nvidia module; do not use with hybrid PRIME primary-iGPU setup.

Section "Device"
	Identifier "NVIDIA"
	Driver     "nvidia"
	Option     "NoLogo" "true"
	Option     "AllowEmptyInitialConfiguration" "true"
EndSection

Section "OutputClass"
	Identifier "nvidia"
	MatchDriver "nvidia-drm"
	Driver "nvidia"
	Option "AllowEmptyInitialConfiguration"
	ModulePath "/usr/lib/nvidia/xorg"
	ModulePath "/usr/lib64/nvidia/xorg"
	ModulePath "/usr/lib/xorg/modules"
EndSection
