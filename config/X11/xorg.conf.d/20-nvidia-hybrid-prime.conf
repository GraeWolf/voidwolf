# voidwolf — hybrid PRIME Render Offload (profile: nvidia-hybrid)
# iGPU is primary (modesetting); NVIDIA is offload sink via voidwolf-prime.
# Install with nvidia-setup.sh --profile nvidia-hybrid
#
# Do NOT set Driver "nvidia" as the only Device — that forces dGPU primary.

Section "OutputClass"
	Identifier "intel"
	MatchDriver "i915"
	Driver "modesetting"
EndSection

Section "OutputClass"
	Identifier "amd"
	MatchDriver "amdgpu"
	Driver "modesetting"
EndSection

Section "OutputClass"
	Identifier "nvidia"
	MatchDriver "nvidia-drm"
	Driver "nvidia"
	Option "AllowEmptyInitialConfiguration"
	# Offload sink; primary remains modesetting iGPU
	Option "PrimaryGPU" "no"
	ModulePath "/usr/lib/nvidia/xorg"
	ModulePath "/usr/lib64/nvidia/xorg"
	ModulePath "/usr/lib/xorg/modules"
EndSection
