# voidwolf — NVIDIA DRM modeset (required for many PRIME / Wayland-less X setups)
# Install: sudo cp to /etc/modprobe.d/voidwolf-nvidia.conf
# Rebuild initramfs if your setup embeds modules (Void usually loads later).

options nvidia-drm modeset=1

# Nouveau must not load alongside proprietary (nvidia package usually blacklists)
# blacklist nouveau
